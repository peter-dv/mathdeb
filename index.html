log:['ตรรกศาสตร์',[()=>{const p=P([1,0]),q=P([1,0]),T=v=>v?'จริง':'เท็จ',F=[['p→q',(p,q)=>!p||q],['p↔q',(p,q)=>p==q],['p∧~q',(p,q)=>p&&!q],['~p→q',(p,q)=>p||q],['~(p∧q)',(p,q)=>!(p&&q)],['(p∨q)→(p∧q)',(p,q)=>!(p||q)||(p&&q)],['~p↔q',(p,q)=>p!=q]],s=sh(F.slice()).slice(0,3),t=s.filter(x=>x[1](p,q)).length;return[`ให้ p เป็น${T(p)}, q เป็น${T(q)} ประพจน์ (1) ${s[0][0]} (2) ${s[1][0]} (3) ${s[2][0]} เป็นจริงกี่ข้อ`,t,[0,1,2,3].filter(x=>x!=t),s.map((x,i)=>`(${i+1}) เป็น${T(x[1](p,q))}`).join('\n')+`\nจริง ${t} ข้อ`]},()=>{const r=R(1,4),s=r+R(3,6);return[`จำนวนเต็ม x ที่ทำให้ x²−${r+s}x+${r*s}<0 เป็นจริงมีกี่ค่า`,s-r-1,[s-r,s-r+1,s-r-2],`(x−${r})(x−${s})<0 → ${r}<x<${s}\nจำนวนเต็มคือ ${s-r-1} ตัว`]}]],
pol:['จำนวนจริงและพหุนาม',[()=>{const a=Z(-3,3),b=Z(-4,4),c=Z(-5,5),k=P([-2,-1,1,2,3]),v=k**3+a*k*k+b*k+c;return[`เศษจากการหาร x³${S(a)}x²${S(b)}x${S(c)} ด้วย x${k<0?'+'+-k:'−'+k} เท่ากับเท่าใด`,v,[-v,v+k,v-2*k],`ทฤษฎีบทเศษเหลือ: เศษ=p(${k})=${v}`]},()=>{const r=R(-4,4),s=R(-3,5)||2,u=r+s,p=r*s;return[`ถ้า α,β เป็นรากของ x²${S(-u)}x${S(p)}=0 แล้ว α²+β² เท่ากับเท่าใด`,u*u-2*p,[u*u+2*p,u*u,u-2*p],`α+β=${u}, αβ=${p}\nα²+β²=(α+β)²−2αβ=${u*u-2*p}`]}]],

mat:['เมทริกซ์',[()=>{const a=R(-3,4),b=R(-3,4),c=R(-3,4),d=R(-3,4),k=P([2,3]),v=k*k*(a*d-b*c);return[`A=[${a} ${b}; ${c} ${d}] จงหา det(${k}A)`,v,[k*(a*d-b*c),a*d-b*c,-v],`det(kA)=k²det(A)=${k*k}×${a*d-b*c}=${v}`]},()=>{const m=Array.from({length:3},()=>Array.from({length:3},()=>R(-3,3))),v=det3(m);return[`จงหา det ของเมทริกซ์ [${m.map(r=>r.join(' ')).join('; ')}]`,v,[-v,v+2,v-3],`กระจายตามแถวที่ 1\n=${v}`]}]],

con:['เรขาคณิตวิเคราะห์และภาคตัดกรวย',[()=>{const t=P(sq),[a,b,h]=t,x=R(-3,3),y=R(-3,3),k=R(1,4),c=k*h-a*x-b*y;return[`ระยะจากจุด (${x},${y}) ถึงเส้นตรง ${a}x${S(b)}y${S(c)}=0`,k,[k*h,k+1,k*h/ (a+b)],`d=|ax₀+by₀+c|/√(a²+b²)=${k*h}/${h}=${k}`]},()=>{const t=P(sq),a=t[2],b=t[1];return[`วงรี x²/${a*a}+y²/${b*b}=1 ระยะระหว่างโฟกัสทั้งสองเท่ากับเท่าใด`,2*t[0],[t[0],a+b,2*a],`c²=a²−b²=${a*a-b*b} → c=${t[0]}\nระยะโฟกัส=2c=${2*t[0]}`]},()=>{const h=Z(-4,4),k=Z(-4,4),r=R(2,6);return[`วงกลม x²+y²${S(-2*h)}x${S(-2*k)}y${S(h*h+k*k-r*r)}=0 มีรัศมีเท่าใด`,r,[r*r,h*h+k*k,r+1],`จัดกำลังสองสมบูรณ์: (x−${h})²+(y−${k})²=${r*r}\nr=${r}`]}]],

cnt:['หลักการนับเบื้องต้น',[()=>{const w=P(['BANANA','APPLE','COMMITTEE','BOOKKEEPER']),c={};[...w].forEach(x=>c[x]=(c[x]||0)+1);const v=f(w.length)/Object.values(c).reduce((a,b)=>a*f(b),1);return[`เรียงอักษรทุกตัวของคำว่า ${w} ได้กี่วิธี`,v,[f(w.length),v*2,v+w.length],`${w.length}! หารด้วย ! ของจำนวนตัวซ้ำ\n=${v}`]},()=>{const n=R(5,8),v=2*f(n-2);return[`จัดคน ${n} คนนั่งรอบโต๊ะกลม โดย 2 คนที่กำหนดต้องนั่งติดกัน ได้กี่วิธี`,v,[f(n-1),f(n-2),2*f(n-1)],`มัด 2 คน: เหลือ ${n-1} หน่วย → (${n-2})!\nสลับ 2 คน ×2 = ${v}`]},()=>{const n=R(5,9);return[`จำนวนคำตอบเป็นจำนวนเต็มไม่ลบของ x+y+z=${n} เท่ากับเท่าใด`,C(n+2,2),[C(n,2),C(n+1,2),C(n+2,3)],`C(n+r−1,r−1)=C(${n+2},2)=${C(n+2,2)}`]}]],
prb:['ความน่าจะเป็น',[()=>{const a=R(3,6)*10,b=R(3,6)*10,c=R(1,2)*10;return[`P(A)=0.${a}, P(B)=0.${b}, P(A∩B)=0.${c} จงหา P(A∪B)`,((a+b-c)/100).toFixed(2),[((a+b)/100).toFixed(2),((a+b+c)/100).toFixed(2),(a*b/1e4).toFixed(2)],`P(A∪B)=${a/100}+${b/100}−${c/100}=${((a+b-c)/100).toFixed(2)}`]},()=>{const s=R(3,11),n=6-Math.abs(s-7);return[`ทอดลูกเต๋า 2 ลูก ความน่าจะเป็นที่ผลรวมเป็น ${s}`,fr(n,36),[fr(n+1,36),fr(n,12),fr(1,s)],`ผลรวม ${s} ได้ ${n} แบบ จาก 36 → ${fr(n,36)}`]},()=>{const b=R(4,9),ab=R(1,b-1);return[`P(B)=${b}/10, P(A∩B)=${ab}/10 จงหา P(A|B)`,fr(ab,b),[fr(ab,10),fr(b,10),fr(b-ab,b)],`P(A|B)=P(A∩B)/P(B)=${fr(ab,b)}`]}]],
sta:['สถิติ',[()=>{const m=R(10,30),a=R(1,5),b=a+2*R(1,2),v=(a*a+b*b)/2;return[`ข้อมูล ${[m-b,m-a,m+a,m+b].join(', ')} มีความแปรปรวนเท่าใด`,v,[Math.sqrt(v),a*a+b*b,v+m],`ค่าเฉลี่ย=${m}, ส่วนเบี่ยงเบน ±${a},±${b}\nσ²=(${2*a*a}+${2*b*b})/4=${v}`]},()=>{const m=R(10,30),s=R(2,6),a=Z(2,4),b=R(1,9);return[`ข้อมูล x มี μ=${m}, σ=${s} ถ้า y=${a}x+${b} จงหา μ_y+σ_y`,a*m+b+a*s,[a*m+b+s,a*m+b+a*a*s,m+s],`μ_y=${a*m+b}, σ_y=${a}×${s}=${a*s} รวม ${a*m+b+a*s}`]},()=>{const m=R(40,70),s=R(3,8),z=Z(-3,3);return[`μ=${m}, σ=${s} คะแนน ${m+z*s} มี z-score เท่าใด`,z,[-z,z*s,z+1],`z=(x−μ)/σ=${z*s}/${s}=${z}`]}]],
dis:['การแจกแจงความน่าจะเป็น',[()=>{const n=P([10,20,50]),p=P([.2,.4,.5]),v=n*p*(1-p);return[`X~B(${n},${p}) จงหา Var(X)`,+v.toFixed(2),[n*p,+(n*p*p).toFixed(2),+(n*(1-p)).toFixed(2)],`Var=np(1−p)=${n}×${p}×${1-p}=${v.toFixed(2)}`]},()=>{const n=R(3,6);return[`P(X=x)=kx เมื่อ x=1,...,${n} จงหา E(X)`,fr(2*n+1,3),[fr(n+1,2),fr(2,n*(n+1)),fr(n,3)],`Σkx=1 → k=2/${n*(n+1)}\nE(X)=kΣx²=${fr(2*n+1,3)}`]},()=>{const t=P([[1,.3413],[1.5,.4332],[2,.4772]]);return[`X~N(μ,σ²) ถ้า P(0<Z<${t[0]})=${t[1]} จงหา P(X>μ+${t[0]}σ)`,(.5-t[1]).toFixed(4),[t[1].toFixed(4),(.5+t[1]).toFixed(4),(1-t[1]).toFixed(4)],`P(Z>${t[0]})=0.5−${t[1]}=${(.5-t[1]).toFixed(4)}`]}]],
